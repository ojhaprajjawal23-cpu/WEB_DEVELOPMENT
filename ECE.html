
<!DOCTYPE html>
<html>
<head>
    <title>ECE Books</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            font-family: Arial;
            color: rgb(66, 16, 16);
        }

        h2 {
            text-align: center;
            padding: 15px;
            background: rgb(172, 118, 76);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background: rgb(176, 88, 21);
            color: white;
        }

        img {
            width: 65px;
            height: 85px;
        }

        button {
            background: rgb(176, 88, 21);
            color: white;
            padding: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>ECE Books Catalogue</h2>

    <table>
        <tr>
            <th>Cover</th>
            <th>Book Details</th>
            <th>Price</th>
            <th>Cart</th>
        </tr>

        <tr>
            <td><img src="ece1.jpg" alt="Electronic Devices"></td>
            <td>
                Book: Electronic Devices<br><br>
                Author: Boylestad<br><br>
                Publisher: Pearson
            </td>
            <td>$45</td>
            <td>
                <button onclick="addCart('Electronic Devices')">
                    Add to Cart
                </button>
            </td>
        </tr>

        <tr>
            <td><img src="ece2.jpg" alt="Communication Systems"></td>
            <td>
                Book: Communication Systems<br><br>
                Author: Simon Haykin<br><br>
                Publisher: Wiley
            </td>
            <td>$50</td>
            <td>
                <button onclick="addCart('Communication Systems')">
                    Add to Cart
                </button>
            </td>
        </tr>

        <tr>
            <td><img src="ece3.jpg" alt="Digital Electronics"></td>
            <td>
                Book: Digital Electronics<br><br>
                Author: Morris Mano<br><br>
                Publisher: Pearson
            </td>
            <td>$40</td>
            <td>
                <button onclick="addCart('Digital Electronics')">
                    Add to Cart
                </button>
            </td>
        </tr>
    </table>

    <script>
    function addCart(book, price) {
        // if the price is not passed, read it from the "$..." cell in the same row
        if (price === undefined) {
            var cells = event.target.closest("tr").querySelectorAll("td");
            for (var i = 0; i < cells.length; i++) {
                var text = cells[i].textContent.trim();
                if (text.charAt(0) === "$") {
                    price = parseFloat(text.substring(1));
                    break;
                }
            }
        }

        var cart = JSON.parse(localStorage.getItem("cart")) || [];
        var found = false;

        for (var j = 0; j < cart.length; j++) {
            if (cart[j].name === book) {
                cart[j].qty += 1;
                found = true;
            }
        }

        if (!found) {
            cart.push({ name: book, price: price, qty: 1 });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        alert(book + " added to cart!");
    }
    </script>

</body>
</html>
