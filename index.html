<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book  Store</title>
    <link rel="stylesheet" href="this.css">
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .header{
            background: rgb(176, 88, 21);
            color :rgb(43, 21, 21);
            height : 80px;
            font-size: 30px;
            display: flex;
            align-items: center;
        }
        .logo img{
            width: 21%;
            height : 21%;
            text-align: center;
        }
        .title{
            font-weight: bold;
            flex :1;
            text-align: center;
        }
        .menu{
            display: flex;
            height:50px;
            background:rgb(172, 118, 76);
            justify-content: space-around;
            align-items: center;
        }
        .menu a{
            text-decoration: none;
            color:rgb(66, 16, 16);
            font-weight: bold;
        }
        .main{
            display: flex;
            height : 500px;
        }
        .left{
            width: 200px;
            border:1px solid black;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .left a{
            text-decoration: none;
            color:rgb(66, 16, 16);
            margin-block: 2rem;
        }
        .right{
            flex:1;
            border:1px solid black;
            align-items: last baseline;
            padding: 20px;
        }
        .right iframe{
            width :100%;
            height :100%;
            border: none;
        }

    </style>
</head>
<body>
    <div class = "header">
        <div class = "logo" >
            <img  src ="logo.jpg" alt = "logo">
        </div>
        <div class = "title">Website Name</div>
    </div>
    <div class = "menu">
       <a href="home.html" target = "content">Home</a>
       <a href="">Login</a>
       <a href="">Registration</a>
       <a href="">Catalogue</a>
       <a href="">Cart</a>
    </div>
   <div class = "main">
        <div class = "left">
            <a href = "CSE.html"  target="content">CSE</a>
            <a href = "ECE.html"  target="content">ECE</a>
            <a href = "EEE.html"  target="content">EEE</a>
            <a href = "CIVIL.html"  target="content">CIVIL</a>
        </div>
        <div class = "right">
            <iframe src="home.html" name="content"></iframe>
        </div>
   </div>
</body>
</html>
