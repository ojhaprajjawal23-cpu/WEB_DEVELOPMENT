
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            background-color: rgb(245, 243, 241);
            font-family: Arial, sans-serif;
            color: rgb(66, 16, 16);
            text-align: center;
        }

        h2 {
            background-color: rgb(176, 88, 21);
            color: rgb(43, 21, 21);
            padding: 20px;
            margin-top: 20px;
        }

        form {
            margin-top: 40px;
        }

        label {
            display: inline-block;
            width: 100px;
            text-align: left;
            font-weight: bold;
        }

        input {
            padding: 8px;
            margin: 10px;
            border: 1px solid rgb(66, 16, 16);
            background-color: white;
        }

        button {
            padding: 8px 20px;
            margin: 10px;
            background-color: rgb(176, 88, 21);
            color: rgb(43, 21, 21);
            border: 1px solid rgb(66, 16, 16);
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: rgb(66, 16, 16);
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Login Page</h2>

    <form onsubmit="login(event)">
        <label>User Name:</label>
        <input type="text" id="username" required>
        <br>

        <label>Password:</label>
        <input type="password" id="password" required>
        <br>

        <button type="submit">Submit</button>
        <button type="reset" onclick="clearMessage()">Reset</button>
    </form>

    <p id="message"></p>

    <script>
        function login(event) {
            event.preventDefault();

            document.getElementById("message").innerHTML =
                "Login button clicked!";
        }

        function clearMessage() {
            document.getElementById("message").innerHTML = "";
        }
    </script>

</body>
</html>
